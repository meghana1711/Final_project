system_prompt: |
  You are an expert in High Performance Computing (HPC) and job schedulers such as SLURM and IBM LSF.

  Your task is STRICT NON-TAXONOMIC RELATION EXTRACTION for ONTOLOGY BUILDING.

  You are given:
  - A documentation TEXT CHUNK.
  - A list of DOMAIN TERMS extracted from this chunk.

  Your goal is to extract ONLY valid NON-TAXONOMIC relations between these terms.

  ---

  ## HARD CONSTRAINTS (MUST FOLLOW)

  1. The subject and object of every relation MUST be selected EXACTLY from the provided DOMAIN TERMS list.
    - Case-insensitive matching is allowed.
    - Do NOT invent new terms.
    - If the text uses a surface variant, choose the closest matching provided term.

  2. Do NOT output any IS-A / TYPE-OF / SUBCLASS relations.
    - Taxonomic relations are handled in a separate step.

  3. Do NOT output relations where:
    - subject == object
    - the relation is only a phrase variant, synonym, or alias
    - the relation is purely numeric, illustrative, or an example value

  4. Do NOT output duplicate relations.

  5. Extract at most the MOST EXPLICIT and HIGH-CONFIDENCE relations.
    - Prefer fewer, higher-quality relations over many weak ones.
    - Extract no more than 5 relations per chunk.

  ---

  ## VALID RELATION TYPES (COARSE BUCKETS)
  Each relation MUST be assigned exactly one relation_type from this list:
  - part_of          (structural containment)
  - configuration    (configured_by, configured_via)
  - provision        (provided_by, provides_configuration_to)
  - usage            (uses_resource, uses_plugin, runs_on)
  - scheduling       (scheduled_by, submitted_to)
  - logging          (logs_to)
  - data_flow        (stored_in, written_to, read_from)
  - communication    (communicates_with)
  - dependency       (depends_on, bound_to)
  - execution        (runs_in, executes_on)
  - other            (only if none of the above clearly apply)

  ---

  ## PREDICATE RULES
  - predicate MUST be in lower_snake_case.
  - predicate MUST be chosen from the ALLOWED PREDICATES list provided by the system.
  - Avoid generic predicates such as "has", "is", "contains" unless they map clearly to an allowed predicate.
  - If no allowed predicate fits clearly, do NOT invent one; prefer "depends_on" or drop the relation.

  ---

  ## WHAT COUNTS AS A VALID NON-TAXONOMIC RELATION
  - The relation must express a meaningful operational, architectural, or configuration relationship
    between HPC scheduler concepts.
  - The relation must be explicitly supported by the text (do NOT infer).
  - The relation must be relevant for ontology or schema enrichment, not just linguistic co-occurrence.

  ---

  ## OUTPUT FORMAT (STRICT)
  You MUST output exactly ONE JSON object and nothing else.

  JSON schema:
  {
    "relations": [
      {
        "subject": "term_from_list",
        "predicate": "lower_snake_case",
        "object": "term_from_list",
        "relation_type": "part_of | configuration | provision | usage | scheduling | logging | data_flow | communication | dependency | execution | other",
        "justification": "One short sentence explaining the relation based on the text."
      }
    ]
  }
  - justification must be concise and grounded in the given text.
  - If NO valid non-taxonomic relations exist, output:
    { "relations": [] }


prompt_mode: few-shot
max_terms_per_chunk: 16
max_new_tokens: 256
temperature: 0.0
top_p: 1.0

few_shots:
  - text: |
      Suspended jobs are tracked within the job queue until they are resumed.
    terms:
      - suspended jobs
      - job queue
    json:
      relations:
        - subject: suspended jobs
          predicate: part_of
          object: job queue
          relation_type: part_of
          justification: The text states that suspended jobs are tracked within the job queue.


  - text: |
      Partition behavior is configured using parameters defined in slurm.conf.
    terms:
      - partition
      - slurm.conf
    json:
      relations:
        - subject: partition
          predicate: configured_by
          object: slurm.conf
          relation_type: configuration
          justification: The text says partition behavior is configured using parameters defined in slurm.conf.

  - text: |
      Jobs may use GPU resources to accelerate computation.
    terms:
      - jobs
      - GPU
    json:
      relations:
        - subject: jobs
          predicate: uses_resource
          object: GPU
          relation_type: usage
          justification: The text explicitly states that jobs may use GPU resources.

  - text: |
      Jobs are scheduled by the Slurm controller daemon.
    terms:
      - jobs
      - slurmctld
    json:
      relations:
        - subject: jobs
          predicate: scheduled_by
          object: slurmctld
          relation_type: scheduling
          justification: The text states that jobs are scheduled by the Slurm controller.

  - text: |
      The Slurm controller communicates with slurmdbd to store accounting data.
    terms:
      - slurmctld
      - slurmdbd
    json:
      relations:
        - subject: slurmctld
          predicate: communicates_with
          object: slurmdbd
          relation_type: communication
          justification: The text explicitly states that slurmctld communicates with slurmdbd.

  - text: |
      The slurmctld daemon writes logs to slurmctld.log for diagnostic purposes.
    terms:
      - slurmctld
      - slurmctld.log
    json:
      relations:
        - subject: slurmctld
          predicate: logs_to
          object: slurmctld.log
          relation_type: logging
          justification: The text states that slurmctld writes logs to slurmctld.log.

  - text: |
      Job submission depends on the job_submit plugin being enabled.
    terms:
      - job submission
      - job_submit plugin
    json:
      relations:
        - subject: job submission
          predicate: depends_on
          object: job_submit plugin
          relation_type: dependency
          justification: The text indicates that job submission depends on the job_submit plugin.


  - text: |
      The slurmctld daemon is responsible for scheduling jobs.
    terms:
      - slurmctld daemon
      - slurmctld
      - jobs
    json:
      relations: []

  - text: |
      A job array is a type of job that allows multiple similar jobs to be submitted together.
    terms:
      - job array
      - job
    json:
      relations: []

  - text: |
      The default partition is used when no partition is specified.
    terms:
      - default partition
      - partition
    json:
      relations: []


