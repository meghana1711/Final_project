system_prompt: |
  You are an expert in High Performance Computing (HPC) and job schedulers such as SLURM and IBM LSF.
  Your task is PRECISE TERM ENRICHMENT for ONTOLOGY BUILDING.

  Input:
  - TERM: a candidate term (already extracted)
  - CONTEXT: a short documentation excerpt where the term appears

  Output EXACTLY one JSON object with these keys and allowed values.

  Allowed scheduler:
    - slurm | lsf | both | generic | unknown

  Allowed category:
    - scheduler | command | option_flag | config_param | config_file | log_or_state_path
      | queue_or_partition | resource | job_state | user_role | other_hpc | non_domain

  Allowed ontology_role:
    - class | object_property | datatype_property | individual | drop | unknown

  Allowed dul_bucket:
    - unknown | information_object | object | description | event

  Rules:
  - Be conservative. If not clearly HPC/scheduler domain, set is_hpc_domain=false, category=non_domain, ontology_role=drop.
  - If unsure about ontology_role or dul_bucket, output "unknown".
  - Provide 1–2 short sentences for definition if domain; else short explanation or "".

  Output JSON schema:
  {
    "term": "...",
    "canonical": "...",
    "is_hpc_domain": true/false,
    "scheduler": "slurm|lsf|both|generic|unknown",
    "category": "...",
    "ontology_role": "class | object_property | datatype_property | individual | drop | unknown",
    "dul_bucket": "unknown | information_object | object | description | event",
    "definition": "...",
    "aliases": ["..."]
  }

prompt_mode: few-shot
max_new_tokens: 240

few_shot_examples:
  - term: "sbatch"
    context: |
      Use sbatch to submit a batch script to Slurm. The command returns a job ID.
    json:
      term: "sbatch"
      canonical: "sbatch"
      is_hpc_domain: true
      scheduler: "slurm"
      category: "command"
      ontology_role: "individual"
      dul_bucket: "information_object"
      definition: "sbatch is a Slurm command used to submit a batch job script to the scheduler."
      aliases: ["sbatch command"]

  - term: "slurm.conf"
    context: |
      The slurm.conf file defines cluster configuration such as partitions, nodes, and scheduler parameters.
    json:
      term: "slurm.conf"
      canonical: "slurm.conf"
      is_hpc_domain: true
      scheduler: "slurm"
      category: "config_file"
      ontology_role: "individual"
      dul_bucket: "information_object"
      definition: "slurm.conf is Slurm’s main configuration file defining cluster and scheduling settings."
      aliases: []

  - term: "10 minutes"
    context: |
      For example, set the timeout to 10 minutes.
    json:
      term: "10 minutes"
      canonical: "10 minutes"
      is_hpc_domain: false
      scheduler: "unknown"
      category: "non_domain"
      ontology_role: "drop"
      dul_bucket: "unknown"
      definition: "Not a domain term; this is a numeric example value."
      aliases: []

  - term: "AccountingStorageType"
    context: |
      AccountingStorageType defines the backend plugin used for Slurm accounting storage.
    json:
      term: "AccountingStorageType"
      canonical: "AccountingStorageType"
      is_hpc_domain: true
      scheduler: "slurm"
      category: "config_param"
      ontology_role: "datatype_property"
      dul_bucket: "description"
      definition: "AccountingStorageType configures the accounting storage backend used by Slurm."
      aliases: []

  - term: "partition"
    context: |
      A partition is a logical grouping of compute nodes used to schedule jobs with similar resource requirements.
    json:
      term: "partition"
      canonical: "Partition"
      is_hpc_domain: true
      scheduler: "both"
      category: "queue_or_partition"
      ontology_role: "class"
      dul_bucket: "object"
      definition: "A partition is a logical grouping of compute nodes that defines scheduling and resource policies."
      aliases: []

  - term: "job"
    context: |
      A job represents a unit of work submitted to the scheduler for execution on compute resources.
    json:
      term: "job"
      canonical: "Job"
      is_hpc_domain: true
      scheduler: "both"
      category: "other_hpc"
      ontology_role: "class"
      dul_bucket: "event"
      definition: "A job is a unit of work submitted to a scheduler for execution on allocated compute resources."
      aliases: []

  - term: "compute node"
    context: |
      Compute nodes provide CPU, memory, and accelerator resources for executing scheduled jobs.
    json:
      term: "compute node"
      canonical: "ComputeNode"
      is_hpc_domain: true
      scheduler: "both"
      category: "resource"
      ontology_role: "class"
      dul_bucket: "object"
      definition: "A compute node is a physical or virtual machine that provides resources for job execution."
      aliases: ["node"]

  - term: "QoS"
    context: |
      Quality of Service (QoS) defines scheduling policies such as priority, limits, and preemption behavior for jobs.
    json:
      term: "QoS"
      canonical: "QoS"
      is_hpc_domain: true
      scheduler: "both"
      category: "queue_or_partition"
      ontology_role: "class"
      dul_bucket: "description"
      definition: "Quality of Service is a policy construct that defines scheduling priority, limits, and preemption behavior."
      aliases: ["Quality of Service"]

  - term: "job state"
    context: |
      A job state indicates the current execution status of a job, such as pending, running, or completed.
    json:
      term: "job state"
      canonical: "JobState"
      is_hpc_domain: true
      scheduler: "both"
      category: "job_state"
      ontology_role: "class"
      dul_bucket: "description"
      definition: "A job state represents the execution status of a job during its lifecycle."
      aliases: []

  - term: "RUNNING"
    context: |
      A job in the RUNNING state is currently executing on allocated compute nodes.
    json:
      term: "RUNNING"
      canonical: "RUNNING"
      is_hpc_domain: true
      scheduler: "both"
      category: "job_state"
      ontology_role: "individual"
      dul_bucket: "event"
      definition: "RUNNING indicates that a job is actively executing on allocated compute resources."
      aliases: []