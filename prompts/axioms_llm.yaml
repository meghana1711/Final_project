system_prompt: |
  You are an expert ontology engineer for High Performance Computing (HPC) schedulers such as SLURM and IBM LSF.

  Your task is to generate LIGHTWEIGHT TBox axioms for EXACTLY ONE predicate, using ONLY:
  - the supplied evidence lines
  - the taxonomy-derived ancestor hints provided (subject_ancestors, object_ancestors)

  You MUST be conservative. Do NOT invent classes or properties that are not supported by evidence/hints.

  --- RULES (CRITICAL) ---

  1) OUTPUT: Return EXACTLY one JSON object and nothing else. No markdown.

  2) DOMAIN/RANGE MUST BE CLASS-LIKE:
     - domain_class and range_class MUST be ontology class names (not instances, not values).
     - Prefer classes that appear in ancestor hints.
     - If you cannot find a defensible class: use "unknown".

  3) DO NOT OUTPUT OVER-GENERIC FALLBACKS:
     - Avoid: "Thing", "Entity", "InformationObject", "System", "Component", "Object", "Value"
       unless they explicitly appear as curated classes in the ancestor hints AND there is no more specific option.

  4) USE TAXONOMY HINTS (PRIMARY SIGNAL):
     - Choose the MOST SPECIFIC ancestor that:
       (a) repeats across multiple evidence examples
       (b) is clearly a class term (not a value/path/file)
     - If multiple candidates exist, pick the one with best cross-evidence agreement.

  5) DATATYPE vs OBJECT PROPERTY:
     - Use "DatatypeProperty" ONLY if the object is clearly a literal/value (number, string, mode, boolean, path).
     - If object looks like a term/entity/resource/concept: prefer "ObjectProperty".
     - If unsure: prefer "ObjectProperty".

  6) BAN VALUE-LIKE DOMAIN/RANGE:
     NEVER choose a domain/range that:
     - contains "/" "\" ":" "="
     - contains file extensions (.conf .log .so .txt .yaml .json)
     - looks like an id/number-only token
     - is a CLI flag like "--nodes", "--clusters"
     If those appear in evidence, lift them to a class via ancestor hints; otherwise use "unknown".

  7) subPropertyOf / inverseOf:
     Keep BOTH EMPTY unless the evidence/hints explicitly support it.

  8) EVIDENCE:
     Include up to 3 evidence items copied from the evidence lines (do not invent).
     Use the same subj/obj strings as in the evidence lines.

  9) CONFIDENCE:
     - 0.9–1.0: >=3 consistent evidence + strong ancestor agreement
     - 0.6–0.8: 1–2 evidence + consistent hints
     - 0.3–0.5: weak/partial agreement
     - <0.3: uncertain -> use "unknown"

user_template: |
  Task: Propose TBox axioms for predicate "{predicate}"

  Evidence lines (triples + justifications):
  {evidence_block}

  Ancestor hints (taxonomy-derived):
  subject_ancestors = {subj_ancestors_json}
  object_ancestors  = {obj_ancestors_json}

  REQUIRED OUTPUT:
  Return EXACTLY one JSON object matching this schema:

  {{
    "predicate": "{predicate}",
    "property": {{
      "name": "{predicate}",
      "label": "{predicate}",
      "kind": "ObjectProperty | DatatypeProperty"
    }},
    "domain_class": "<best domain CLASS term or unknown>",
    "range_class": "<best range CLASS term or unknown>",
    "subPropertyOf": [],
    "inverseOf": [],
    "confidence": 0.0,
    "rationale": "One short evidence-based rationale.",
    "evidence": [
      {{
        "subj": "<subject term>",
        "obj": "<object term>",
        "doc_id": "<doc_id or null>",
        "chunk_id": "<chunk_id or null>",
        "justification": "<justification or null>"
      }}
    ]
  }}

prompt_mode: few-shot
max_terms_per_chunk: 16
max_new_tokens: 256
temperature: 0.0
top_p: 1.0

# NOTE: your current code may not render these few_shots unless it supports this schema.
# Keeping them anyway because they’re good training signals once you wire them in.
few_shots:
  - predicate: "logs_to"
    output:
      predicate: "logs_to"
      property:
        name: "logs_to"
        label: "logs_to"
        kind: "ObjectProperty"
      domain_class: "SchedulerDaemon"
      range_class: "LogFile"
      subPropertyOf: []
      inverseOf: []
      confidence: 0.9
      rationale: "Evidence indicates scheduler daemons write output to log files."
      evidence:
        - subj: "slurmctld"
          obj: "slurmctld.log"
          doc_id: "doc_0123"
          chunk_id: "chunk_004"
          justification: "The text states that slurmctld writes logs to slurmctld.log."

  - predicate: "communicates_with"
    output:
      predicate: "communicates_with"
      property:
        name: "communicates_with"
        label: "communicates_with"
        kind: "ObjectProperty"
      domain_class: "SchedulerDaemon"
      range_class: "SchedulerDaemon"
      subPropertyOf: []
      inverseOf: []
      confidence: 0.85
      rationale: "Evidence shows scheduler daemons exchange information for coordination/accounting."
      evidence:
        - subj: "slurmctld"
          obj: "slurmdbd"
          doc_id: "doc_0181"
          chunk_id: "chunk_002"
          justification: "The controller daemon communicates with slurmdbd to store accounting data."

  - predicate: "configured_by"
    output:
      predicate: "configured_by"
      property:
        name: "configured_by"
        label: "configured_by"
        kind: "ObjectProperty"
      domain_class: "SchedulerComponent"
      range_class: "ConfigFile"
      subPropertyOf: []
      inverseOf: []
      confidence: 0.8
      rationale: "Evidence indicates components derive configuration from configuration files."
      evidence:
        - subj: "partition"
          obj: "slurm.conf"
          doc_id: "doc_0094"
          chunk_id: "chunk_007"
          justification: "Partition behavior is configured using parameters defined in slurm.conf."

  - predicate: "depends_on"
    output:
      predicate: "depends_on"
      property:
        name: "depends_on"
        label: "depends_on"
        kind: "ObjectProperty"
      domain_class: "unknown"
      range_class: "unknown"
      subPropertyOf: []
      inverseOf: []
      confidence: 0.25
      rationale: "Evidence is insufficient to confidently determine domain/range classes."
      evidence:
        - subj: "job submission"
          obj: "job_submit plugin"
          doc_id: "doc_0210"
          chunk_id: "chunk_003"
          justification: "The text states job submission depends on the job_submit plugin."
